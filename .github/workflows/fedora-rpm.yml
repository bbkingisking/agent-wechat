name: Fedora ARM64 RPM

# Personal fork builds only: no upstream release workflow or signing secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fedora-rpm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rpm:
    name: Build and validate Fedora 45 ARM64 RPM
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    container: fedora:45
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_TERM_COLOR: always
      TARGET: aarch64-unknown-linux-gnu
    steps:
      - name: Install build dependencies in the disposable container
        run: |
          dnf install -y git curl gcc gcc-c++ make cmake pkgconf-pkg-config \
            perl-core perl-Text-Template \
            openssl-devel gtk3-devel webkit2gtk4.1-devel libappindicator-gtk3-devel \
            librsvg2-devel dbus-devel pulseaudio-libs-devel \
            rpm-build cpio findutils tar gzip unzip xz python3 desktop-file-utils \
            gnome-keyring libsecret xorg-x11-server-Xvfb python3-dbus python3-gobject
      - uses: actions/checkout@v7
      - name: Trust the runner-mounted checkout inside this container
        # Tests spawn tools with different HOME directories; keep this exact
        # mount trusted in the disposable container's system Git configuration.
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: fedora45-arm64-rpm
          cache-on-failure: true
          workspaces: |
            packages/native-client-rust -> target
            packages/desktop/src-tauri -> target
      - name: Install desktop workspace dependencies
        run: pnpm install --frozen-lockfile --filter @agent-wechat/desktop...
      - name: Check package metadata and build the shared SDK
        run: |
          pnpm --filter @agent-wechat/desktop build
          pnpm --filter @agent-wechat/shared build
          pnpm --filter @agent-wechat/desktop test
      - name: Build and smoke-test the native hub
        run: |
          cargo build --release --locked --manifest-path packages/native-client-rust/Cargo.toml --target "$TARGET" -p wx-native
          python3 packages/native-client-rust/scripts/smoke.py "packages/native-client-rust/target/$TARGET/release/wx"
          pnpm --filter @agent-wechat/desktop prepare:sidecars --target "$TARGET"
      - name: Give repeated builds of the same version increasing RPM releases
        env:
          RPM_RELEASE: ${{ github.run_number }}.${{ github.run_attempt }}.fc45
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('packages/desktop/src-tauri/tauri.fedora.conf.json'));
          config.bundle.linux.rpm.release = process.env.RPM_RELEASE;
          writeFileSync(`${process.env.RUNNER_TEMP}/fedora-rpm.json`, JSON.stringify(config));
          JS
      - name: Build only the Fedora RPM
        run: |
          pnpm --filter @agent-wechat/desktop app:build --target "$TARGET" --bundles rpm --config "$RUNNER_TEMP/fedora-rpm.json"
          cargo test --release --locked --manifest-path packages/desktop/src-tauri/Cargo.toml --target "$TARGET"
      - name: Validate package layout, architecture and executables
        run: |
          packages=(packages/desktop/src-tauri/target/"$TARGET"/release/bundle/rpm/*.rpm)
          test "${#packages[@]}" -eq 1
          node packages/desktop/test/validate-rpm.mjs "${packages[0]}"
          dnf install -y "${packages[0]}"
          rpm -V agent-wechat
          desktop-file-validate /usr/share/applications/AgentWechat.desktop
      - name: Verify installed tray attention in an isolated desktop session
        env:
          DESKTOP_BINARY: /usr/bin/agent-wechat
          TRAY_ICON_TEST_SESSION: '1'
          GSETTINGS_BACKEND: memory
          GIO_USE_VFS: local
          NO_AT_BRIDGE: '1'
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
          # Test-only: WebKit's process sandbox cannot run inside this root container.
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
        run: |
          tray_test_root=$(mktemp -d)
          mkdir -m 700 "$tray_test_root/config" "$tray_test_root/data" "$tray_test_root/cache" "$tray_test_root/run"
          env XDG_CONFIG_HOME="$tray_test_root/config" XDG_DATA_HOME="$tray_test_root/data" \
            XDG_CACHE_HOME="$tray_test_root/cache" XDG_RUNTIME_DIR="$tray_test_root/run" \
            dbus-run-session -- xvfb-run -a bash -c \
            'printf "fixture-password\n" | gnome-keyring-daemon --unlock --components=secrets; node packages/desktop/test/tray-attention.mjs'
      - name: Stage RPM, checksum and build identity
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p artifacts/fedora-rpm
          cp packages/desktop/src-tauri/target/"$TARGET"/release/bundle/rpm/*.rpm artifacts/fedora-rpm/
          cd artifacts/fedora-rpm
          sha256sum ./*.rpm > SHA256SUMS
          printf 'Source commit: %s\nBuild: %s\nTarget: Fedora 45 aarch64\n' "$SOURCE_COMMIT" "$BUILD_URL" > BUILD.txt
          {
            echo '### Fedora 45 ARM64 RPM'
            echo 'Download the artifact below and extract it, then run:'
            echo '```sh'
            echo 'sha256sum -c SHA256SUMS'
            echo 'sudo dnf install ./AgentWechat-*.aarch64.rpm'
            echo '```'
            echo 'Unsigned personal build. Updates use DNF; the upstream in-app updater is not supported for this RPM.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: AgentWechat-fedora45-aarch64-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/fedora-rpm/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: Publish Fedora RPM release
    needs: rpm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.rpm.outputs.artifact-id }}
          path: release
          merge-multiple: true
      - name: Publish the validated files as a GitHub Release
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const directory = 'release';
            const files = fs.readdirSync(directory).sort();
            const rpms = files.filter(name => /^AgentWechat-.*\.aarch64\.rpm$/.test(name));
            if (rpms.length !== 1 || files.length !== 3 || !files.includes('SHA256SUMS') || !files.includes('BUILD.txt')) {
              throw new Error('Expected exactly one validated RPM, SHA256SUMS and BUILD.txt');
            }
            const identity = fs.readFileSync(path.join(directory, 'BUILD.txt'), 'utf8');
            if (!identity.includes(`Source commit: ${context.sha}\n`)) throw new Error('Artifact source commit mismatch');
            const checksum = fs.readFileSync(path.join(directory, 'SHA256SUMS'), 'utf8').trim();
            const bytes = fs.readFileSync(path.join(directory, rpms[0]));
            const digest = require('node:crypto').createHash('sha256').update(bytes).digest('hex');
            if (checksum !== `${digest}  ./${rpms[0]}`) throw new Error('RPM checksum mismatch');
            // A retry of only this job reuses the successful build's artifact.
            const match = rpms[0].match(/-(\d+)\.(\d+)\.fc45\.aarch64\.rpm$/);
            if (!match || match[1] !== String(context.runNumber)) throw new Error('Unexpected RPM build identity');
            const build = `${match[1]}.${match[2]}`;
            const tag = `fedora45-aarch64-${build}`;
            const body = [
              'Personal Fedora 45 ARM64 build. The RPM is unsigned.',
              '',
              'Download the RPM and SHA256SUMS into the same folder, quit AgentWechat, then:',
              '```sh',
              'sha256sum -c SHA256SUMS',
              `sudo dnf install ./${rpms[0]}`,
              '```',
              '',
              'Use downloaded RPMs for updates; the upstream in-app updater is not supported for these fork builds.',
              '',
              identity.trim(),
            ].join('\n');
            // Publish only after every asset has uploaded; failed uploads leave a draft.
            let release;
            try {
              ({data: release} = await github.rest.repos.getReleaseByTag({...context.repo, tag}));
              if (release.target_commitish !== context.sha) throw new Error('Release source commit mismatch');
              if (!release.draft) {
                await core.summary.addLink('Download the Fedora RPM release', release.html_url).write();
                return;
              }
              for (const asset of release.assets) {
                await github.rest.repos.deleteReleaseAsset({...context.repo, asset_id: asset.id});
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              ({data: release} = await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag, target_commitish: context.sha,
                name: `AgentWechat — Fedora 45 ARM64 (build ${build})`,
                body, draft: true, prerelease: false,
              }));
            }
            for (const name of files) {
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: release.id, name,
                headers: {'content-type': 'application/octet-stream'},
                data: fs.readFileSync(path.join(directory, name)),
              });
            }
            const {data: published} = await github.rest.repos.updateRelease({
              ...context.repo, release_id: release.id, draft: false, make_latest: 'true',
            });
            await core.summary.addLink('Download the Fedora RPM release', published.html_url).write();
